<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDD Stall Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-12">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-lg">
                    <i data-lucide="store" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold leading-tight">BDD Stall Tracker</h1>
                    <p class="text-xs text-slate-400">Business Development Department Inventory System</p>
                </div>
            </div>
            <button onclick="exportJSON()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-md border border-slate-700 flex items-center gap-2 transition">
                <i data-lucide="download" class="w-4 h-4"></i> Backup Data
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">
        
        <!-- Dashboard Summary Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Kabuuan (Total)</p>
                    <h3 id="count-total" class="text-3xl font-bold text-slate-900 mt-1">0</h3>
                </div>
                <div class="bg-slate-100 p-3 rounded-full text-slate-600">
                    <i data-lucide="layers" class="w-6 h-6"></i>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-emerald-600 uppercase tracking-wider">Available</p>
                    <h3 id="count-available" class="text-3xl font-bold text-emerald-600 mt-1">0</h3>
                </div>
                <div class="bg-emerald-50 p-3 rounded-full text-emerald-600">
                    <i data-lucide="check-circle" class="w-6 h-6"></i>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-amber-600 uppercase tracking-wider">Occupied</p>
                    <h3 id="count-occupied" class="text-3xl font-bold text-amber-600 mt-1">0</h3>
                </div>
                <div class="bg-amber-50 p-3 rounded-full text-amber-600">
                    <i data-lucide="user-check" class="w-6 h-6"></i>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-rose-600 uppercase tracking-wider">Under Maintenance</p>
                    <h3 id="count-maintenance" class="text-3xl font-bold text-rose-600 mt-1">0</h3>
                </div>
                <div class="bg-rose-50 p-3 rounded-full text-rose-600">
                    <i data-lucide="wrench" class="w-6 h-6"></i>
                </div>
            </div>
        </div>

        <!-- Main Content Layout (Form + Table) -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Input Form Card -->
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 sticky top-24">
                    <h2 id="form-title" class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <i data-lucide="plus-circle" class="w-5 h-5 text-blue-600"></i> Dagdag Bagong Stall
                    </h2>
                    
                    <form id="stall-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                        <input type="hidden" id="stall-id">

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Station *</label>
                            <input type="text" id="station" required placeholder="Hal. Recto, Cubao, Legarda" 
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Stall Name / Number *</label>
                            <input type="text" id="stall-name" required placeholder="Hal. Stall A-01 o Hindi pa tinukoy" 
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Size (sqm) *</label>
                            <input type="text" id="stall-size" required placeholder="Hal. 3 sqm, 12 sqm" 
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Status *</label>
                            <select id="stall-status" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                <option value="Available">Available</option>
                                <option value="Occupied">Occupied</option>
                                <option value="Under Maintenance">Under Maintenance</option>
                                <option value="Reserved">Reserved</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Remarks</label>
                            <textarea id="stall-remarks" rows="3" placeholder="Hal. Wala, For LOI review, Pending documents..." 
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-
